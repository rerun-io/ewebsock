[package]
name = "example_app"
version = "0.1.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
edition = "2021"
include = ["../LICENSE-APACHE", "../LICENSE-MIT", "**/*.rs", "Cargo.toml"]
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.95"

[features]
default = []

## Test the tokio backend:
tokio = ["ewebsock/tokio", "dep:tokio"]

[dependencies]
ewebsock = { workspace = true, features = ["tls", "rustls_ring"] }

eframe.workspace = true
env_logger.workspace = true
log.workspace = true

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
web-sys.workspace = true # to access the DOM (to hide the loading text)
